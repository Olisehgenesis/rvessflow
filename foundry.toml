[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@superfluid-finance/ethereum-contracts/=lib/superfluid/ethereum-contracts/",
    "@superfluid-finance/solidity-semantic-money/=lib/superfluid/solidity-semantic-money/",
    "@openzeppelin-v5/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 64

[invariant]
runs = 20
depth = 8
fail_on_revert = false

[profile.coverage.fuzz]
runs = 16

[profile.coverage.invariant]
runs = 8
depth = 4
fail_on_revert = false

[fmt]
line_length = 120

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
